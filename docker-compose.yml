services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: pugstone
      POSTGRES_PASSWORD: pugstone
      POSTGRES_DB: pugstone
    ports: ['5433:5432']
    volumes: ['pgdata:/var/lib/postgresql/data']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U pugstone']
      interval: 5s
      retries: 10
volumes:
  pgdata:
